<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle with purple gradient -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Compass rose outer ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

  <!-- North pointer (white) -->
  <polygon points="256,96 272,250 256,230 240,250" fill="#ffffff" filter="url(#shadow)"/>
  <!-- South pointer (light purple) -->
  <polygon points="256,416 240,262 256,282 272,262" fill="rgba(255,255,255,0.45)"/>
  <!-- East pointer (white) -->
  <polygon points="416,256 262,240 282,256 262,272" fill="#ffffff" filter="url(#shadow)"/>
  <!-- West pointer (light purple) -->
  <polygon points="96,256 250,272 230,256 250,240" fill="rgba(255,255,255,0.45)"/>

  <!-- Center jewel -->
  <circle cx="256" cy="256" r="22" fill="#ffffff" opacity="0.95"/>
  <circle cx="256" cy="256" r="12" fill="#9333ea"/>

  <!-- Cardinal tick marks -->
  <line x1="256" y1="90" x2="256" y2="105" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="407" x2="256" y2="422" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="256" x2="105" y2="256" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round"/>
  <line x1="407" y1="256" x2="422" y2="256" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round"/>
</svg>
